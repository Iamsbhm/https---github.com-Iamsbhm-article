<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SF BEN -  Tech News Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <a href="/" class="logo">SF BEN</a>
            <button class="mobile-menu-toggle" id="mobileMenuToggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="nav-links" id="navLinks">
                <a href="/events" class="nav-link">Events</a>
                <a href="/career" class="nav-link">Career</a>
                <a href="/appassessor" class="nav-link">AppAssessor</a>
                <a href="/salesforcenews" class="nav-link">Salesforce News</a>
                <a href="/articlesbyrole" class="nav-link">Articles by Role</a>
            </div>
            <div class="search-container">
                <input type="search" class="search-box" placeholder="Search..." id="searchInput">
                <button class="search-button" id="searchButton">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path fill="currentColor" d="M9.5 3A6.5 6.5 0 0116 9.5c0 1.61-.59 3.09-1.56 4.23l.27.27h.79l5 5-1.5 1.5-5-5v-.79l-.27-.27A6.516 6.516 0 019.5 16 6.5 6.5 0 013 9.5 6.5 6.5 0 019.5 3m0 2C7 5 5 7 5 9.5S7 14 9.5 14 14 12 14 9.5 12 5 9.5 5z"/>
                    </svg>
                </button>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="tabs">
            <button class="tab active" data-category="latest">Latest</button>
            <button class="tab" data-category="popular">Most Popular</button>
            <button class="tab" data-category="editors">Editors' Picks</button>
        </div>

        <div class="articles-grid" id="articlesGrid">
             <img src="assets/image.png">
        </div>

        <div class="loading-spinner" id="loadingSpinner">
            <div class="spinner"></div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-section">
                <h3>About Us</h3>
                <p>Your trusted source for the latest tech news and insights.</p>
            </div>
            <div class="footer-section">
                <h3>Quick Links</h3>
                <ul>
                    <li><a href="/contact">Contact</a></li>
                    <li><a href="/privacy">Privacy Policy</a></li>
                    <li><a href="/terms">Terms of Service</a></li>
                </ul>
            </div>
            <div class="footer-section">
                <h3>Newsletter</h3>
                <form class="newsletter-form" id="newsletterForm">
                    <input type="email" placeholder="Enter your email" required>
                    <button type="submit">Subscribe</button>
                </form>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2025 Tech News Portal. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
